{% extends "hr/base.html" %}
{% block title %}Capture leave{% endblock %}
{% block content %}
<p><a href="{% url 'hr:leave_list' %}">Leave applications</a></p>
<h1>{{ heading }}</h1>
<form method="post" enctype="multipart/form-data">
  {% include "hr/_fields.html" %}
  <button type="submit" name="action" value="submit">{{ submit_label }}</button>
  <button type="submit" name="action" value="draft" class="secondary">Save draft</button>
</form>
<script>
(function () {
  var typeField = document.getElementById("id_leave_type");
  var parentField = document.getElementById("id_other_parent_employed");
  if (!typeField || !parentField) {
    return;
  }
  function selectedKind() {
    var selected = typeField.options[typeField.selectedIndex];
    return selected ? selected.getAttribute("data-kind") : "";
  }
  function syncParentField() {
    var open = selectedKind() === "maternity" || selectedKind() === "parental";
    parentField.disabled = !open;
    if (!open) {
      parentField.value = "unknown";
    }
  }
  typeField.addEventListener("change", syncParentField);
  syncParentField();
})();
</script>
{% endblock %}
